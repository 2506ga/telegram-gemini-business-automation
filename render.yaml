services:
  - type: web
    name: ponte-pilar-gestion
    runtime: python
    plan: 0.5c-512mb
    rootDir: gestion_telegram_gemini_mvp
    buildCommand: pip install -r requirements.txt
    startCommand: python run_all.py
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: ponte-pilar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/gestion.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_TELEGRAM_USERS
        sync: false
